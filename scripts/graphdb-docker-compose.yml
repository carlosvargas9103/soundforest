# Standardized local GraphDB instance for FOREST-KG (licensed, v11.2.x).
#
# GraphDB 11+ always requires a license file (even the free tier -- see
# https://graphdb.ontotext.com/documentation/11.2/licensing.html). Point
# GRAPHDB_LICENSE_PATH at yours, e.g. in a local .env file next to this
# compose file (untracked -- .env is in .gitignore):
#   echo "GRAPHDB_LICENSE_PATH=$HOME/.graphdb/work/graphdb.license" > scripts/.env
#
# Usage:
#   docker compose -f scripts/graphdb-docker-compose.yml up -d
#   docker compose -f scripts/graphdb-docker-compose.yml down
#
# Workbench + SPARQL endpoint: http://localhost:7200
# Data persists in the named volume `graphdb-data` across restarts.
#
# The eventual Gradio app runs on Hugging Face (remote), so it cannot reach
# `localhost:7200` on this machine. Until GraphDB is deployed somewhere
# publicly reachable (or tunneled), scripts/load_kg.py and any later query
# service read the endpoint from GRAPHDB_URL / --graphdb-url rather than
# hardcoding localhost, so pointing them at a future public URL is a config
# change, not a code change. Exposing this port to the internet is a
# separate, deliberate step -- not done by this file.

services:
  graphdb:
    image: ontotext/graphdb:11.2.1
    container_name: forest-kg-graphdb
    restart: unless-stopped
    ports:
      - "7200:7200"
    volumes:
      - graphdb-data:/opt/graphdb/home
      - ${GRAPHDB_LICENSE_PATH:?set GRAPHDB_LICENSE_PATH, see comment above}:/opt/graphdb/home/conf/graphdb.license:ro
    environment:
      GDB_JAVA_OPTS: "-Xmx2g -Xms1g"

volumes:
  graphdb-data:
