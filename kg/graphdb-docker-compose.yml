# Local GraphDB for FOREST-KG. Needs a license file even on the free tier:
#   echo "GRAPHDB_LICENSE_PATH=$HOME/.graphdb/work/graphdb.license" > scripts/.env
#
# Usage: docker compose -f scripts/graphdb-docker-compose.yml up -d
# Workbench + SPARQL endpoint: http://localhost:7200

services:
  graphdb:
    image: ontotext/graphdb:11.2.1
    container_name: forest-kg-graphdb
    restart: unless-stopped
    ports:
      - "7200:7200"
    volumes:
      - graphdb-data:/opt/graphdb/home
      - ${GRAPHDB_LICENSE_PATH:?set GRAPHDB_LICENSE_PATH, see comment above}:/opt/graphdb/home/conf/graphdb.license:ro
    environment:
      GDB_JAVA_OPTS: "-Xmx2g -Xms1g"

volumes:
  graphdb-data:
